# Jackson 配置
spring.jackson.time-zone=GMT+8

# 数据源配置
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/smartdoctor?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# PageHelper 分页插件配置
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
pagehelper.page-size-zero=true

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.jackson.default-property-inclusion=non_null

# 日志配置
logging.level.root=INFO
logging.level.com.qst.medical=DEBUG
logging.level.org.springframework.security=DEBUG
